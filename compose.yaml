# Local testing deployment: builds the Dockerfile and serves the proxy on the
# host. The image's built-in HEALTHCHECK (entrypoint subcommand — scratch has
# no shell) is inherited; compose does not override it.
#
# Usage (create ./config.yaml first — see config.example.yaml for the
# annotated schema, or docs/deployment.md for a minimal anonymous document;
# optionally copy .env.example to .env for the environment, see below):
#   docker compose up -d --build                  # anonymous free tier
#   HOST_PORT=9090 docker compose up -d --build   # different host port
#
# The proxy's service settings (upstream base, UA sync cadence)
# live in the OCFP_CONFIG document mounted below — the removed OFP_API_KEY /
# OFP_UPSTREAM_BASE / OFP_UA_SYNC_INTERVAL env vars no longer exist. The
# mounted ./config.yaml is operator-owned and gitignored; config.example.yaml
# in the repo root shows the full schema, from a minimal direct egress to a
# non-default upstream.

services:
  proxy:
    build:
      context: .
    image: opencode-free-proxy:dev
    container_name: opencode-free-proxy
    restart: unless-stopped
    # Drain budget: compose's stop_grace_period default is 10s, which would
    # SIGKILL 45s before the proxy's OCFP_SHUTDOWN_GRACE drain window
    # (default 55s) ends. 60s lets in-flight streams run to the force-close.
    stop_grace_period: 60s
    ports:
      # Under compose the listen port stays 8090 (the mapping targets it) —
      # publish on a different host port via HOST_PORT, not OCFP_PORT.
      - "${HOST_PORT:-30258}:8090"
    # A present .env (see .env.example) feeds compose's ${...} substitution
    # above AND passes straight into the container: the OCFP_* overrides and
    # every ${VAR} secret the mounted config.yaml references resolve without
    # hand-adding environment lines. required:false — no .env, no
    # passthrough, defaults hold. environment: below still wins over
    # env_file, pinning the document path to the mount.
    env_file:
      - path: .env
        required: false
    environment:
      # The config document is the single source of truth for upstream.base
      # and user_agent.sync_interval. The file is re-read every
      # poll interval and hot-reloaded on change. environment overrides
      # env_file, so a stray OCFP_CONFIG in .env cannot repoint this.
      OCFP_CONFIG: /etc/ofp/config.yaml
    volumes:
      # Bind, don't copy: editing the file on the host (adding an egress,
      # pointing upstream.base elsewhere) hot-reloads. It binds a SINGLE
      # FILE, so the host edit must stay IN PLACE (truncate+write; vim:
      # backupcopy=yes) — a host-side rename (vim's default write, sed -i)
      # swaps in a new inode the container never sees, and the reload
      # never fires. Mount the directory instead to replace freely — see
      # docs/deployment.md "Editing the mounted file".
      - ./config.yaml:/etc/ofp/config.yaml:ro
