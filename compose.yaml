# Local testing deployment: builds the Dockerfile and serves the proxy on the
# host. The image's built-in HEALTHCHECK (entrypoint subcommand — scratch has
# no shell) is inherited; compose does not override it.
#
# Usage (create ./config.yaml first — see config.example.yaml for the
# annotated schema, or docs/deployment.md for a minimal anonymous document):
#   docker compose up -d --build                  # anonymous free tier
#   HOST_PORT=9090 docker compose up -d --build   # different host port
#
# The proxy's service settings (upstream base, UA sync cadence)
# live in the OCFP_CONFIG document mounted below — the removed OFP_API_KEY /
# OFP_UPSTREAM_BASE / OFP_UA_SYNC_INTERVAL env vars no longer exist. The
# mounted ./config.yaml is operator-owned and gitignored; config.example.yaml
# in the repo root shows the full schema, from a minimal direct egress to a
# non-default upstream.

services:
  proxy:
    build:
      context: .
    image: opencode-free-proxy:dev
    container_name: opencode-free-proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-30258}:8090"
    environment:
      # The config document is the single source of truth for upstream.base
      # and user_agent.sync_interval. The file is re-read every
      # poll interval and hot-reloaded on change.
      OCFP_CONFIG: /etc/ofp/config.yaml
    volumes:
      # Bind, don't copy: editing the file on the host (adding an egress,
      # pointing upstream.base elsewhere) hot-reloads in place.
      - ./config.yaml:/etc/ofp/config.yaml:ro
