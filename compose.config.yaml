# OpenCode free proxy — minimal deployment config (docker compose default).
#
# Direct egress to the default OpenCode Zen upstream (https://opencode.ai),
# no inbound auth, default 1 h UA-sync cadence — the same behavior the
# removed OFP_API_KEY / OFP_UPSTREAM_BASE / OFP_UA_SYNC_INTERVAL env vars
# used to configure, now expressed as a config document.
#
# To require a Bearer key from clients, add an auth section (see
# example.config.yaml in the repo root for the annotated schema):
#
#   auth:
#     keys:
#       - name: primary
#         key: "${OFP_PRIMARY_API_KEY}"
#
# The key is an env reference interpolated at load time — unset variables are
# a load error, so export OFP_PRIMARY_API_KEY before starting the container.
# (An anonymous key is impossible by design: an empty or unset reference
# would fail validation rather than silently disabling auth.)

egress:
  - id: direct

routes:
  - id: default
    egress: [direct]
